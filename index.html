                                calculateScore(answers);
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                } else {
                    clearInterval(interval);
                }
                return () => clearInterval(interval);
            }, [status, timeLeft]);

            const handleAnswer = (qIndex, optionIndex) => {
                setAnswers(prev => ({
                    ...prev,
                    [qIndex]: optionIndex
                }));
            };

            const calculateScore = (finalAnswers = answers) => {
                let correctCount = 0;
                questionsDB.forEach((q, index) => {
                    if (finalAnswers[index] === q.answer) {
                        correctCount++;
                    }
                });
                setScore(correctCount);
            };

            const handleFinish = () => {
                const isConfirmed = window.confirm("Tem certeza que deseja finalizar e entregar o simulado agora?");
                if(isConfirmed) {
                    calculateScore();
                    setStatus('review');
                }
            };

            const handleStart = () => setStatus('playing');
            const handlePause = () => setStatus('paused');
            const handleResume = () => setStatus('playing');
            const handleRestart = () => {
                if(window.confirm("Isso apagará o simulado atual e criará um novo. Deseja continuar?")) {
                    localStorage.removeItem('cpa_simulado_state');
                    setAnswers({});
                    setTimeLeft(9000);
                    setCurrentQuestion(0);
                    setStatus('start');
                }
            };

            const formatTime = (seconds) => {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const stats = useMemo(() => {
                const answeredCount = Object.keys(answers).length;
                return { answeredCount, total: questionsDB.length };
            }, [answers]);

            if (status === 'start') {
                return (
                    <div className="flex flex-col items-center justify-center h-full bg-slate-900 text-slate-100 p-6">
                        <div className="max-w-2xl text-center space-y-6">
                            <h1 className="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-green-400 to-emerald-600">Simulado Oficial ANBIMA</h1>
                            <h2 className="text-2xl font-semibold text-slate-300">Nova CPA (Base)</h2>
                            <p className="text-slate-400 text-lg leading-relaxed">
                                Este simulado contém as <strong>50 questões calibradas</strong> da nova estrutura. 
                                <br/><br/>
                                <span className="text-amber-300 bg-amber-900/40 px-3 py-1 rounded">Novidade:</span> Modo de <strong>Estudo Ativo</strong> habilitado! Ao clicar na resposta, você verá imediatamente se acertou ou errou, junto com a explicação oficial do gabarito.
                            </p>
                            <div className="grid grid-cols-3 gap-4 bg-slate-800 p-6 rounded-xl text-center mt-6 shadow-lg shadow-black/50">
                                <div><div className="text-3xl font-bold text-white">50</div><div className="text-sm text-slate-400">Questões</div></div>
                                <div><div className="text-3xl font-bold text-white">2h 30m</div><div className="text-sm text-slate-400">Tempo Limite</div></div>
                                <div><div className="text-3xl font-bold text-white">70%</div><div className="text-sm text-slate-400">Média (35 acertos)</div></div>
                            </div>
                            <div className="pt-8">
                                <button onClick={handleStart} className="px-8 py-4 bg-green-600 hover:bg-green-500 transition-colors text-white text-xl font-bold rounded-full shadow-lg shadow-green-900/50 transform hover:scale-105 active:scale-95 w-full md:w-auto">
                                    Iniciar Estudo Ativo
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (status === 'paused') {
                return (
                    <div className="flex flex-col items-center justify-center h-full bg-slate-900 text-slate-100 p-6">
                        <div className="text-center space-y-6">
                            <h2 className="text-4xl font-bold text-white">Simulado Pausado</h2>
                            <p className="text-xl text-slate-400">Tempo restante: <span className="font-mono text-green-400 font-bold">{formatTime(timeLeft)}</span></p>
                            <p className="text-slate-500">Seu progresso foi salvo. Você pode fechar a janela e voltar depois.</p>
                            <div className="flex flex-col md:flex-row gap-4 justify-center pt-8">
                                <button onClick={handleResume} className="px-8 py-3 bg-green-600 hover:bg-green-500 text-white font-bold rounded-lg shadow-lg">Continuar</button>
                                <button onClick={handleRestart} className="px-8 py-3 bg-slate-700 hover:bg-red-600 text-white font-bold rounded-lg transition-colors">Reiniciar Simulado</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (status === 'review') {
                const isApproved = score >= 35;
                const percent = Math.round((score / questionsDB.length) * 100);
                
                return (
                    <div className="h-full overflow-y-auto custom-scrollbar bg-slate-50 p-4 md:p-8">
                        <div className="max-w-4xl mx-auto space-y-8">
                            <div className={`p-8 rounded-2xl shadow-lg text-center ${isApproved ? 'bg-gradient-to-br from-green-500 to-emerald-700 text-white' : 'bg-gradient-to-br from-red-500 to-rose-700 text-white'}`}>
                                <h1 className="text-4xl font-bold mb-2">{isApproved ? 'Parabéns! Você foi Aprovado(a) 🥳' : 'Não foi dessa vez. Continue estudando! 📚'}</h1>
                                <p className="text-xl opacity-90">Sua pontuação final:</p>
                                <div className="text-6xl font-black mt-4">{score} <span className="text-3xl font-medium">/ 50</span></div>
                                <div className="text-xl mt-2 font-semibold">({percent}%) - Mínimo exigido: 70%</div>
                                <button onClick={handleRestart} className="mt-8 px-6 py-2 bg-white/20 hover:bg-white/30 backdrop-blur font-bold rounded-lg transition-colors">Refazer Simulado</button>
                            </div>
                            
                            <div className="text-center text-slate-500 mt-8">
                                O gabarito e as explicações detalhadas já foram conferidos ao longo das questões no modo Estudo Ativo. Refaça o simulado para praticar novamente!
                            </div>
                        </div>
                    </div>
                );
            }

            const q = questionsDB[currentQuestion];
            const hasAnsweredCurrent = answers[currentQuestion] !== undefined;

            return (
                <div className="flex flex-col h-full overflow-hidden bg-slate-50">
                    {/* Header bar */}
                    <header className="glass-panel flex items-center justify-between p-3 md:p-4 z-20 sticky top-0 shrink-0">
                        <div className="flex items-center gap-2 md:gap-4">
                            <button onClick={() => setIsMobileMenuOpen(true)} className="p-2 md:hidden bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg shadow-sm border border-slate-200" title="Menu de Questões">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>
                            </button>
                            <button onClick={handlePause} className="p-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg shadow-sm border border-slate-200" title="Pausar simulado">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                            </button>
                            <div className="hidden md:block font-bold text-slate-700">Modo Estudo Ativo</div>
                        </div>
                        
                        <div className={`text-lg md:text-xl font-mono font-bold flex items-center gap-1 md:gap-2 ${timeLeft < 300 ? 'text-red-600 animate-pulse' : 'text-slate-800'}`}>
                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clipRule="evenodd" /></svg>
                            {formatTime(timeLeft)}
                        </div>

                        <button onClick={handleFinish} className="px-3 md:px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white text-sm font-bold rounded-lg shadow-md transition-colors">
                            Entregar
                        </button>
                    </header>

                    <div className="flex flex-1 overflow-hidden relative">
                        {/* Mobile Overlay */}
                        {isMobileMenuOpen && (
                            <div 
                                className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-30 md:hidden"
                                onClick={() => setIsMobileMenuOpen(false)}
                            ></div>
                        )}

                        {/* Sidebar (Responsive Drawer) */}
                        <aside className={`fixed inset-y-0 left-0 z-40 transform ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 md:static w-72 md:w-64 bg-white border-r border-slate-200 flex flex-col h-full transition-transform duration-300 shadow-2xl md:shadow-none`}>
                            <div className="p-4 border-b border-slate-100 flex justify-between items-center md:hidden shrink-0">
                                <span className="font-bold text-slate-700">Navegação</span>
                                <button onClick={() => setIsMobileMenuOpen(false)} className="p-2 text-slate-500 hover:bg-slate-100 rounded-lg">
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                                </button>
                            </div>
                            <div className="p-4 overflow-y-auto custom-scrollbar flex-1">
                                <div className="text-xs font-bold text-slate-400 mb-4 uppercase tracking-wider">Progresso</div>
                                <div className="mb-4">
                                    <span className="font-bold text-2xl text-slate-700">{stats.answeredCount}</span>
                                    <span className="text-slate-500"> / {stats.total}</span>
                                </div>
                                
                                <div className="grid grid-cols-5 gap-2">
                                    {questionsDB.map((_, i) => {
                                        const isCurrent = i === currentQuestion;
                                        const isAnswered = answers[i] !== undefined;
                                        let btnClass = "h-10 w-full rounded flex items-center justify-center text-sm font-medium border cursor-pointer transition-all";
                                        
                                        if (isCurrent) {
                                            btnClass += " ring-2 ring-blue-500 ring-offset-1 border-transparent " + (isAnswered ? "bg-blue-600 text-white" : "bg-white text-blue-600");
                                        } else if (isAnswered) {
                                            btnClass += " bg-slate-200 border-transparent text-slate-600";
                                        } else {
                                            btnClass += " bg-white border-slate-200 text-slate-400 hover:bg-slate-50";
                                        }

                                        return (
                                            <button key={i} onClick={() => { setCurrentQuestion(i); setIsMobileMenuOpen(false); }} className={btnClass} title={`Ir para questão ${i+1}`}>{i + 1}</button>
                                        )
                                    })}
                                </div>
                            </div>
                        </aside>

                        {/* Main Question Area */}
                        <main className="flex-1 overflow-y-auto custom-scrollbar bg-slate-50 relative">
                            {/* pb-28 garante que o conteúdo não seja escondido pelo rodapé fixo no mobile */}
                            <div className="max-w-3xl mx-auto p-4 md:p-8 pb-28 md:pb-28">
                                <div className="mb-6 md:mb-8">
                                    <div className="flex items-center gap-3 mb-4">
                                        <span className="bg-slate-800 text-white px-3 py-1 rounded font-bold text-sm">Questão {currentQuestion + 1}</span>
                                        <span className="bg-slate-200 text-slate-600 px-3 py-1 rounded text-sm">{q.diff}</span>
                                    </div>
                                    <h2 className="text-base md:text-xl text-slate-800 leading-relaxed font-medium whitespace-pre-wrap">
                                        {q.text}
                                    </h2>
                                </div>

                                <div className="space-y-3">
                                    {q.options.map((option, idx) => {
                                        const isSelected = answers[currentQuestion] === idx;
                                        const hasAnswered = answers[currentQuestion] !== undefined;
                                        const isCorrect = idx === q.answer;
                                        
                                        let optionClass = 'border-slate-200 bg-white hover:border-blue-300 hover:bg-slate-50 cursor-pointer';
                                        let dotClass = 'border-slate-300';
                                        let textClass = 'text-slate-600';
                                        let letterClass = 'text-slate-400';

                                        if (hasAnswered) {
                                            if (isCorrect) {
                                                optionClass = 'border-green-500 bg-green-50/50 shadow-sm cursor-default';
                                                dotClass = 'border-green-500 bg-green-500';
                                                textClass = 'text-green-900 font-medium';
                                                letterClass = 'text-green-700';
                                            } else if (isSelected) {
                                                optionClass = 'border-red-500 bg-red-50/50 shadow-sm cursor-default';
                                                dotClass = 'border-red-500 bg-red-500';
                                                textClass = 'text-red-900 font-medium line-through opacity-70';
                                                letterClass = 'text-red-700';
                                            } else {
                                                optionClass = 'border-slate-200 bg-white opacity-50 cursor-default';
                                                dotClass = 'border-slate-300';
                                                textClass = 'text-slate-400';
                                            }
                                        }

                                        return (
                                            <label key={idx} className={`flex items-start gap-3 md:gap-4 p-3 md:p-4 rounded-xl border-2 transition-all ${optionClass}`}>
                                                <div className="pt-0.5 md:pt-1 shrink-0">
                                                    <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center ${dotClass}`}>
                                                        {hasAnswered && (isCorrect || isSelected) && <div className="w-2.5 h-2.5 bg-white rounded-full"></div>}
                                                        {!hasAnswered && isSelected && <div className="w-2.5 h-2.5 bg-blue-500 rounded-full"></div>}
                                                    </div>
                                                </div>
                                                <div className={`flex-1 text-sm md:text-lg ${textClass}`}>
                                                    <span className={`font-bold mr-1 md:mr-2 ${letterClass}`}>{String.fromCharCode(65 + idx)})</span> 
                                                    {option}
                                                </div>
                                                <input type="radio" name={`question-${currentQuestion}`} value={idx} checked={isSelected} onChange={() => !hasAnswered && handleAnswer(currentQuestion, idx)} disabled={hasAnswered} className="hidden" />
                                            </label>
                                        )
                                    })}
                                </div>

                                {/* Seção de Feedback Imediato */}
                                {hasAnsweredCurrent && (
                                    <div className={`mt-6 p-4 md:p-5 rounded-xl border-l-4 shadow-sm transition-all duration-500 ${answers[currentQuestion] === q.answer ? 'bg-green-50 border-green-500' : 'bg-red-50 border-red-500'}`}>
                                        <h3 className={`font-bold text-base md:text-lg mb-2 flex items-center gap-2 ${answers[currentQuestion] === q.answer ? 'text-green-800' : 'text-red-800'}`}>
                                            {answers[currentQuestion] === q.answer ? (
                                                <><svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 md:h-6 md:w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg> Resposta Correta!</>
                                            ) : (
                                                <><svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 md:h-6 md:w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg> Resposta Incorreta</>
                                            )}
                                        </h3>
                                        <p className="text-sm md:text-base text-slate-700 leading-relaxed whitespace-pre-wrap">
                                            {q.explanation}
                                        </p>
                                    </div>
                                )}
                            </div>
                        </main>
                    </div>

                    {/* Footer Nav Bar - Fixo no Mobile */}
                    <footer className="glass-panel fixed bottom-0 left-0 right-0 md:left-64 p-3 md:p-4 border-t border-slate-200 flex justify-between items-center z-10 pb-safe">
                        <button 
                            onClick={() => setCurrentQuestion(prev => Math.max(0, prev - 1))}
                            disabled={currentQuestion === 0}
                            className={`px-4 md:px-6 py-2.5 rounded-lg font-bold flex items-center gap-1 md:gap-2 ${currentQuestion === 0 ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 shadow-sm'}`}>
                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clipRule="evenodd" /></svg>
                            <span className="hidden sm:inline">Anterior</span>
                        </button>

                        <div className="text-xs md:text-sm font-bold text-slate-600 bg-slate-200 px-3 py-1.5 rounded-full">
                            {currentQuestion + 1} / {questionsDB.length}
                        </div>

                        {currentQuestion < questionsDB.length - 1 ? (
                            <button 
                                onClick={() => setCurrentQuestion(prev => Math.min(questionsDB.length - 1, prev + 1))}
                                className="px-4 md:px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold shadow-md flex items-center gap-1 md:gap-2 transition-colors">
                                <span className="hidden sm:inline">Próxima</span>
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clipRule="evenodd" /></svg>
                            </button>
                        ) : (
                            <button 
                                onClick={handleFinish}
                                className="px-4 md:px-6 py-2.5 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold shadow-md flex items-center gap-1 md:gap-2 transition-colors">
                                <span className="hidden sm:inline">Finalizar</span>
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" /></svg>
                            </button>
                        )}
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
    </style>
</body>
</html>
