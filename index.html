<body class="text-slate-800 antialiased h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;

        const questionsDB = [
            { id: 1, diff: "Médio", text: "Jorge, estagiário em uma cooperativa de crédito, consulta Paulo, profissional CPA, para entender a diferença entre uma cooperativa de crédito e um banco cooperativo. Paulo explica que os papéis de ambas são bastante distintos... Para deixar mais explícita esta diferenciação, Paulo poderia explicar que a cooperativa:", options: ["atua como representante do banco cooperativo e este realiza a captação e a concessão de crédito.", "concentra serviços financeiros para pessoas jurídicas e o banco cooperativo atua com pessoas físicas.", "atende o cooperado (capta/empresta) e o banco cooperativo provê infraestrutura, liquidez e acesso a mercados.", "realiza operações de crédito e o banco cooperativo atua como intermediário direto no mercado financeiro."], answer: 2, explanation: "Gabarito: A cooperativa singular é quem interage com o cooperado na ponta, concedendo crédito, captando recursos e ofertando serviços diretamente. Já o banco cooperativo funciona como a 'espinha dorsal' do sistema, garantindo a infraestrutura de liquidez e acesso a mercados." },
            { id: 2, diff: "Médio", text: "Durante o atendimento financeiro, Tereza, servidora pública, comenta que está avaliando participar de um plano de previdência complementar... Renata explica à cliente que esta modalidade (PGBL) é mais vantajosa quando a pessoa:", options: ["deseja que a tributação ocorra sobre os rendimentos no resgate, buscando aproveitar o aporte sem que a base seja o valor total acumulado.", "tem renda tributável e contribui ao regime oficial (INSS/RPPS), usando o plano para diferir até 12% da renda, via declaração completa de IR, e tributar o total no resgate/benefício.", "não possui renda tributável no ano e pretende usar o plano para reduzir imposto futuro, independentemente de contribuir para o regime oficial.", "atua como autônoma sem contribuição ao regime oficial e pretende usar o plano para organizar a poupança previdenciária, visando benefício fiscal."], answer: 1, explanation: "Gabarito: O PGBL permite diferir IR ao abater até 12% da renda bruta tributável do ano, desde que o cliente contribua para o INSS/RPPS. A tributação ocorre sobre o total resgatado no futuro." },
            { id: 3, diff: "Médio", text: "Durante uma palestra, Marina foi questionada sobre ações do Banco Central no mercado monetário. Eles queriam entender qual é o objetivo dessas medidas. Marina explicou que essas medidas têm como objetivo:", options: ["fixar os juros de longo prazo e os preços do crédito, adotando intervenção direta nos contratos privados.", "assegurar a expansão contínua do crédito por metas de volume, a fim de garantir crescimento econômico.", "eliminar a volatilidade diária dos mercados financeiros por operações que neutralizam choques, sem alterar os juros.", "ajustar a quantidade de moeda no sistema, modulando a liquidez e orientando as taxas de juros de curto prazo."], answer: 3, explanation: "Gabarito: A política monetária atua sobre a liquidez e os juros de curto prazo por meio de instrumentos como operações de mercado aberto, compulsórios e redesconto." },
            { id: 4, diff: "Médio", text: "Durante a divulgação de novas projeções fiscais, analistas destacaram o aumento das despesas primárias... O profissional CPA deve entender que a relação central entre as variáveis apresentadas é que:", options: ["o desequilíbrio fiscal eleva o risco-país, deteriora as expectativas de inflação e pressiona as taxas de juros, que tendem a crescer.", "o aumento das despesas públicas estimula permanentemente a atividade econômica, independentemente da origem do financiamento.", "o déficit fiscal é compensado automaticamente pela política monetária, mantendo neutros os efeitos sobre inflação e juros.", "a expansão do gasto público gera, por si só, equilíbrio entre arrecadação e consumo agregado no longo prazo."], answer: 0, explanation: "Gabarito: O desequilíbrio fiscal eleva o risco-país e pressiona os juros e a inflação para cima, reduzindo o espaço para investimentos produtivos." },
            { id: 5, diff: "Médio", text: "Marcelo foi procurado por um cliente que mantém carteira em Tesouro Direto e multimercado. Após notícias de que o governo não fará ajuste fiscal... Marcelo deve explicar que essa decisão do governo tende a:", options: ["estimular o crescimento econômico sem impacto relevante sobre inflação e juros, favorecendo o desempenho de títulos públicos.", "reduzir a necessidade de financiamento do governo, aumentar a confiança dos investidores pelo aumento dos juros e contribuir para a valorização dos títulos públicos já emitidos.", "elevar a percepção de risco, pressionar inflação e juros e provocar desvalorização dos títulos de renda fixa já emitidos, afetando negativamente o desempenho de parte da carteira.", "produzir efeitos restritos às contas públicas, sem influência relevante sobre taxas de juros ou sobre os preços de ativos financeiros."], answer: 2, explanation: "Gabarito: Quando há percepção de descontrole fiscal, investidores exigem prêmios de risco maiores, pressionando taxas de juros. Com juros mais altos, o preço dos títulos já emitidos tende a cair (marcação a mercado)." },
            { id: 6, diff: "Médio", text: "Ao comentar notícias recentes sobre endividamento público, alguns participantes perguntaram como esse tema se relaciona com juros e inflação. Luís explicou que:", options: ["o controle do endividamento público tende a preservar a confiança, embora sem efeito direto sobre crédito privado.", "o equilíbrio fiscal reduz o risco e as pressões sobre juros e inflação, criando um ambiente mais favorável ao investimento produtivo.", "o aumento das despesas públicas pode estimular a economia no curto prazo, ainda que eleve riscos fiscais no longo.", "a ampliação do gasto governamental reduz momentaneamente o desemprego, mas compromete a estabilidade macroeconômica futura."], answer: 1, explanation: "Gabarito: O equilíbrio fiscal reduz o risco-país, estabiliza juros e inflação e amplia a confiança do mercado." },
            { id: 7, diff: "Médio", text: "Carolina explicou que no Brasil existem regras para conter riscos fiscais (LRF e novo arcabouço fiscal). No resumo de Carolina o efeito dessas medidas é:", options: ["manter disciplina fiscal ao limitar o avanço real das despesas, alinhando gastos à inflação.", "garantir previsibilidade ao exigir limites de endividamento e maior transparência na execução orçamentária.", "sustentar confiança ao reforçar regras de alocação de recursos e parâmetros de crescimento compatíveis com arrecadação.", "equilibrar contas públicas ao unir contenção de despesas, limites de dívida e controle da expansão dos gastos primários."], answer: 3, explanation: "Gabarito: Resume a lógica combinada: LRF (limites de dívida) + teto de gastos/arcabouço (contenção da despesa primária), compondo a sustentabilidade fiscal." },
            { id: 8, diff: "Médio", text: "O Banco Central realizou uma operação compromissada para reduzir a quantidade de moeda em circulação e conter juros. Juliana informou ao cliente que a operação seria:", options: ["uma venda de títulos públicos com compromisso de recompra, em data e preço pré-pactuados.", "uma compra de títulos públicos com compromisso de revenda, em data e preço pré-pactuados.", "um empréstimo de títulos públicos com compromisso de pagamento de juros.", "uma venda de títulos públicos com opção compra, em data e preço pré-pactuados."], answer: 0, explanation: "Gabarito: É a compromissada de venda: o BC vende títulos hoje (enxugando liquidez) e se compromete a recomprar depois." },
            { id: 9, diff: "Médio", text: "Sobre o Código de Regulação e Melhores Práticas da Anbima, Roberto explicou que um exemplo de norma presente no Código é:", options: ["reforçar principalmente os padrões fiduciários, deixando a padronização a critério da instituição.", "orientar governança e compliance para elevar a integridade, sem abranger concorrência leal.", "definir parâmetros de conduta que asseguram concorrência leal, padronização de procedimentos e maior qualidade das informações prestadas.", "padronizar comunicação para dar clareza ao investidor, sem cobrir conduta de mercado e concorrência leal."], answer: 2, explanation: "Gabarito: O Código visa complementar a regulação, estabelecendo padrões de conduta que promovem concorrência leal, padronização e melhor qualidade das informações." },
            { id: 10, diff: "Médio", text: "Diante da preocupação com instabilidade no crédito, o profissional deve explicar aos participantes que o Bacen:", options: ["conduz políticas de crédito setoriais, definindo volumes de financiamento.", "adota normas prudenciais, regula a liquidez, promove medidas de estabilidade sistêmica e sustenta a confiança no sistema.", "padroniza a remuneração de ativos, estabelecendo retornos equivalentes para títulos no mercado secundário.", "centraliza a intermediação financeira, assumindo a concessão de crédito no lugar dos bancos."], answer: 1, explanation: "Gabarito: O BACEN atua com normas prudenciais, regulação da liquidez e medidas de estabilidade sistêmica." },
            
            { id: 11, diff: "Médio", text: "Uma empresa realiza IPO e a demanda superou a quantidade ofertada, resultando em rateio. Considerando a dinâmica do bookbuilding, conclui-se que:", options: ["o preço da ação se manterá estável após a listagem graças ao lote suplementar.", "a liquidez atinge seu pico durante o IPO e torna-se restrita no secundário.", "o rateio na oferta primária é pouco relevante para o preço no secundário.", "a demanda elevada no IPO tende a pressionar o preço na abertura do mercado secundário, em que a liquidez real se estabelece."], answer: 3, explanation: "Gabarito: A alta demanda não atendida no IPO (rateio) tende a criar pressão compradora no início das negociações, influenciando o preço no mercado secundário." },
            { id: 12, diff: "Médio", text: "Joel explicou que em certos fundos as perdas podem superar o capital aplicado. Os investidores precisariam assinar um termo que é o:", options: ["termo de adesão e ciência de risco, que formaliza o conhecimento dos cotistas sobre a possibilidade de perdas superiores ao capital aplicado.", "termo de ciência e assunção de responsabilidade patrimonial ilimitada.", "termo de ciência e confirmação de interesse, registrado em meio digital.", "termo de autorização para movimentação de recursos."], answer: 0, explanation: "Gabarito: Segundo a Resolução CVM 175, ao ingressar no fundo, o cotista deve atestar via termo de adesão e ciência de risco que conhece a possibilidade de perdas superiores ao capital." },
            { id: 13, diff: "Médio", text: "A companhia realizará um desdobramento de ações (cada ação passará a representar dez). A informação correta fornecida por Luísa é que:", options: ["não haverá alteração do número de ações no capital social. A participação ficará inalterada.", "não haverá aumento do número de ações. A participação e o capital social serão reduzidos.", "haverá aumento do número de ações no capital social da empresa. A participação de Tânia e o valor do capital social ficarão inalterados.", "haverá aumento do número de ações no capital social. A participação de Tânia será reduzida e o capital aumentado."], answer: 2, explanation: "Gabarito: Um desdobramento (split) aumenta o número de ações em circulação, mas o valor do capital social e a participação proporcional do acionista ficam inalterados." },
            { id: 14, diff: "Fácil", text: "Pedro vai investir no 'Fundo de Investimento Plaza S/C'. A orientação correta é que a regularidade do fundo deve ser verificada junto:", options: ["ao Banco Central.", "à Comissão de Valores Mobiliários (CVM).", "à Bolsa B3.", "à Junta Comercial do estado."], answer: 1, explanation: "Gabarito: Fundos de investimento dependem de prévio registro na CVM (Art. 8º da Resolução 175)." },
            { id: 15, diff: "Médio", text: "Teresa queria investir em títulos individuais após perda num fundo de crédito privado. Raquel explicou que a diversificação do fundo ajuda a:", options: ["assegurar retornos superiores ao fundo, quando comparado a ativos individuais.", "reduzir custos de administração e gerenciamento do fundo.", "permitir liquidez imediata semelhante à dos fundos de renda fixa de alta liquidez.", "reduzir o risco de perdas de crédito decorrentes do não pagamento de emissores individuais."], answer: 3, explanation: "Gabarito: A diversificação não elimina o risco, mas o dilui entre diversos emissores, mitigando o impacto de um calote (default) individual." },
            { id: 16, diff: "Difícil", text: "Como a regulação recente da CVM garante que prejuízos em uma classe de fundo não afetem outra classe ou outros fundos do administrador?", options: ["segregação patrimonial.", "unificação contábil dos fundos.", "compensação de resultados.", "integração operacional entre classes."], answer: 0, explanation: "Gabarito: A Resolução CVM nº 175 estabelece a segregação patrimonial para classes de cotas, impedindo que obrigações de uma classe contaminem as demais." },
            { id: 17, diff: "Médio", text: "César ouviu falar sobre PGBL e quer saber quais perfis se beneficiam dessa modalidade. Rogério esclarece que esse plano:", options: ["é isento de imposto no resgate, ocorrendo tributação só na acumulação.", "é voltado para quem declara o IR no modelo completo e busca deduzir contribuições até o limite legal anual.", "é indicado para quem utiliza o modelo simplificado de IR.", "é destinado a empregados de empresas patrocinadoras."], answer: 1, explanation: "Gabarito: O PGBL é voltado para quem declara no modelo completo, permitindo deduzir até 12% da renda bruta anual tributável. O IR no resgate incide sobre o total." },
            { id: 18, diff: "Médio", text: "Beatriz, dentista (pró-labore de 1 salário mínimo), quer saber se o VGBL é adequado. João explica que o plano é adequado pois:", options: ["é voltado para quem busca deduzir até 12% da renda bruta anual.", "é voltado para quem participa de planos corporativos.", "é voltado para quem declara o IR no modelo simplificado e tributa apenas os rendimentos no resgate.", "é voltado para quem declara IR simplificado e tributa o valor total resgatado."], answer: 2, explanation: "Gabarito: O VGBL é para quem usa o modelo simplificado de IR. A tributação no resgate incide apenas sobre os rendimentos, não sobre o principal." },
            { id: 19, diff: "Fácil", text: "Mauro quer iniciar benefício em previdência por tempo determinado e deixar o restante como herança. A modalidade de benefício é:", options: ["vitalício condicionado à expectativa de vida, sem reversão.", "variável, encerrado automaticamente em caso de morte do titular.", "garantido até o falecimento do titular, convertido em indenização única.", "fixado por prazo determinado, com continuidade ao(s) beneficiário(s) até o fim do período em caso de falecimento do titular."], answer: 3, explanation: "Gabarito: Na Renda Mensal por Prazo Certo, se o participante falecer antes do prazo, os beneficiários continuam recebendo até o fim do período estipulado." },
            { id: 20, diff: "Fácil", text: "Marcos quer refinanciar a fatura do cartão. Camila esclarece que essa operação ocorre por parcelamento, onde:", options: ["as parcelas do cartão são fixas e o prazo é definido, com incidência de encargos financeiros e impostos na operação.", "as parcelas são atualizadas com a taxa do crédito rotativo e prazo definido.", "pode ser contratado sem cobrança de encargos e impostos, se pago o mínimo.", "a extensão para o próximo mês é automática e sem encargos pagando o mínimo."], answer: 0, explanation: "Gabarito: Refinanciamento gera parcelas fixas com juros menores que o rotativo, mas, por ser novo crédito, há cobrança de encargos e IOF." },
            
            { id: 21, diff: "Fácil", text: "Marcos usou o cheque especial e notou que a cobrança foi maior que apenas a taxa de juros informada. Camila esclareceu que:", options: ["os juros incidem sobre o saldo devedor, mas o IOF é recolhido integralmente no primeiro dia, sem diário.", "os juros são calculados por dia sobre os valores realmente usados e o IOF inclui um percentual fixo e outro diário pelo tempo de utilização.", "os juros são debitados no ciclo, enquanto o IOF é cobrado só na ativação do limite.", "o valor baseia-se no saldo negativo médio e o IOF não tem componente fixo."], answer: 1, explanation: "Gabarito: No cheque especial, além dos juros diários, o IOF é composto por uma alíquota fixa na liberação (0,38%) mais uma alíquota diária." },
            { id: 22, diff: "Fácil", text: "Joana, aposentada, quer quitar dívidas. A opção mais adequada entre empréstimo pessoal, financiamento de veículo ou consignado é:", options: ["o empréstimo pessoal, pois garante uso livre dos recursos com taxa reduzida.", "o financiamento do veículo, pois direcionado ao bem tem juros inferiores ao consignado.", "o crédito consignado, pois o desconto em folha reduz risco para o banco, permitindo juros menores e prazos mais longos.", "o financiamento do veículo, pois garante prazos mais extensos que o pessoal."], answer: 2, explanation: "Gabarito: O crédito consignado possui garantia forte (desconto na fonte do benefício do INSS), o que reduz drasticamente o risco e barateia a taxa." },
            { id: 23, diff: "Fácil", text: "O Banco A reduziu o limite do cheque especial e o Banco B disse que foi por causa do aumento do compulsório do Banco Central. Isso ocorre porque o recolhimento compulsório:", options: ["estimula os bancos a remunerarem depósitos à vista.", "promove ajustes operacionais, mas limites se mantém inalterados.", "visa resguardar saldos dos correntistas sem relação direta com liquidez.", "retira dinheiro de circulação, diminuindo o montante que os bancos têm para emprestar e, consequentemente, levando a uma política de crédito mais restritiva."], answer: 3, explanation: "Gabarito: O compulsório imobiliza dinheiro no Banco Central. Com menos dinheiro livre nos caixas dos bancos, a oferta de crédito diminui e fica mais restritiva." },
            { id: 24, diff: "Médio", text: "Fernando observa um cliente irritado com atendimento presencial e outro usando o autoatendimento. Fernando esclarece que:", options: ["o banco disponibiliza canais presenciais, digitais e telefônicos, com segurança e informações claras, e o cliente pode escolher conforme sua necessidade.", "o atendimento presencial tende a ser priorizado para resolver situações de divergências complexas.", "o canal digital substitui o presencial obrigatoriamente para pequenas tarefas.", "a definição do canal segue regras internas e exige autorização do gerente."], answer: 0, explanation: "Gabarito: É direito do consumidor escolher o canal de atendimento que melhor atende sua demanda, seja presencial, digital ou telefônico, que devem ser eficientes." },
            { id: 25, diff: "Médio", text: "Um investidor acredita que aplicar em ativos internacionais envolve muita burocracia e barreiras intransponíveis. O profissional explica que:", options: ["a abertura de conta depende de relacionamento direto com bancos estrangeiros.", "plataformas digitais permitem abrir contas no exterior, com integração cambial e fiscal, ampliando o acesso a diversos perfis.", "as remessas requerem autorização formal do Banco Central a cada operação.", "o acesso é restrito a fundos exclusivos de maior porte (alto patrimônio)."], answer: 1, explanation: "Gabarito: Inovações recentes (plataformas e corretoras digitais) democratizaram e desburocratizaram o acesso do varejo a investimentos diretos no exterior." },
            { id: 26, diff: "Médio", text: "Na renegociação de um crédito consignado, a cliente questiona se o seguro prestamista antigo continua valendo. O profissional explica que:", options: ["a apólice original permanece válida até o término do novo empréstimo.", "o beneficiário passa a ser a instituição bancária independentemente de nova apólice.", "a apólice anterior deixa de vigorar, e exige-se nova cobertura prestamista vinculada ao credor (novo contrato).", "o seguro prestamista cobre genericamente as dívidas do cliente com a instituição."], answer: 2, explanation: "Gabarito: O refinanciamento liquida o contrato antigo e cria um novo. A apólice antiga cobria o risco do contrato anterior e é encerrada; uma nova apólice é necessária." },
            { id: 27, diff: "Fácil", text: "Um casal quer independência financeira em 20 anos. Antes de escolher os produtos mais rentáveis, o profissional deve orientá-los a dimensionar a reserva-alvo considerando:", options: ["o histórico da carteira ao estimar o patrimônio.", "o patrimônio atual corrigido por inflação e os aportes constantes.", "o saldo atual e os valores nominais das despesas futuras.", "a taxa real e o horizonte de tempo para a aposentadoria desejada."], answer: 3, explanation: "Gabarito: Para planejar aposentadoria, o fundamental é usar a taxa de juros real (descontada a inflação) e o horizonte de tempo (20 anos) para trazer a fluxo presente as necessidades." },
            { id: 28, diff: "Médio", text: "O casal tem renda mista (R$ 8.200 + bônus/bicos variáveis) e despesas mensais e sazonais. Para definir quanto poupar mensalmente, devem:", options: ["estimar a renda líquida recorrente, subtrair despesas fixas e a média provisionada das variáveis e sazonais, e usar a sobra como poupança mensal.", "adotar meta fixa baseada na renda total incluindo bicos incertos.", "calcular poupança pela diferença anual projetada assumindo compensações.", "basear poupança nos meses de alta renda para compensar déficits."], answer: 0, explanation: "Gabarito: Para estabilidade do fluxo de caixa, projeta-se as contas com base na renda certa/recorrente e provisiona-se as contas sazonais mensalmente. O que sobra é a poupança real." },
            { id: 29, diff: "Médio", text: "Felipe quer financiar um carro preservando 3 meses de reserva (R$ 27 mil) e com parcela de no máximo 20% da renda (R$ 2.400). A melhor opção é:", options: ["escolher 60x (CET 22%), menor desembolso e longo prazo.", "optar pelo financiamento em 48x (CET 18%), com parcela R$ 2.295 e entrada R$ 20 mil, assegurando parcela abaixo de 20% e preservando os R$ 27 mil.", "adotar 36x com balloon de 40%.", "fechar 48x (CET 17%) com desconto e entrada R$ 25 mil, drenando a reserva."], answer: 1, explanation: "Gabarito: A opção em 48x a 18% (Entrada de R$ 20 mil) mantém a parcela em R$ 2.295 (< R$ 2.400) e consome R$ 20 mil dos R$ 47 mil de reserva, sobrando R$ 27 mil exatos (3 meses)." },
            { id: 30, diff: "Fácil", text: "Ricardo fez aportes em previdência complementar e tem dúvida se deve usar a declaração Completa ou Simplificada de IR. Ele deve considerar:", options: ["a quantidade de fontes de renda e incidência de tributos nas aplicações.", "a forma de recebimento e descontos da classe profissional.", "a relação entre o total de despesas dedutíveis e o desconto padrão, avaliando qual opção resulta na menor base de cálculo do imposto.", "o volume de rendimentos garantindo maior restituição no processamento."], answer: 2, explanation: "Gabarito: Compara-se se as despesas dedutíveis ultrapassam os 20% de desconto do modelo simplificado. O foco é obter a menor base de cálculo para pagar menos imposto." },
            
            { id: 31, diff: "Fácil", text: "Para cobrir despesa médica imprevista, Cláudio avalia cheque especial, rotativo ou empréstimo pessoal. Fernando esclarece que ele deve:", options: ["priorizar o cheque especial pela liberação imediata.", "usar o rotativo do cartão no mês atual para manter flexibilidade.", "verificar empréstimo longo, mesmo com CET muito elevado.", "comparar cada opção e escolher a com menor custo efetivo total e prazo compatível com o fluxo."], answer: 3, explanation: "Gabarito: A escolha de crédito emergencial deve ser pautada pelo menor Custo Efetivo Total (CET) aliado a um prazo que encaixe no orçamento para evitar calotes." },
            { id: 32, diff: "Médio", text: "Felipe é iniciante e desconfortável com oscilações. Marina explica que, para adequar os investimentos, ele precisa definir seu perfil (Suitability), que considera:", options: ["sua tolerância ao risco, seus objetivos financeiros e o horizonte de tempo.", "o histórico de aplicações e volume investido.", "seu comportamento com carteira atual reativa.", "seu nível de familiaridade com as notícias de mercado."], answer: 0, explanation: "Gabarito: O perfil de investidor (Suitability) é estabelecido combinando três pilares: Tolerância a riscos, Objetivos e Prazo (horizonte de tempo)." },
            { id: 33, diff: "Fácil", text: "Roberto aplicou em renda fixa, mas quer migrar para fundo de ações após dica de um amigo. Elisa explicou que, antes de investir, Roberto deve:", options: ["buscar rendimento superior à média de mercado.", "estar alinhado ao perfil de risco, aos objetivos e a seu horizonte de investimento.", "manter liquidez imediata para resgate.", "privilegiar fundos com taxa zero a qualquer custo."], answer: 1, explanation: "Gabarito: Nenhuma recomendação de produto, muito menos de risco elevado como ações, deve ser executada sem verificar o alinhamento de Suitability do cliente." },
            { id: 34, diff: "Difícil", text: "Profissional CPA é pressionado pela equipe a ignorar boas práticas para bater metas de captação mais rápido. Espera-se que o profissional:", options: ["ajuste temporariamente o processo para bater a meta sem alarde.", "reporte o conflito apenas se o cliente perder dinheiro.", "reafirme internamente os princípios de integridade, transparência e lealdade, sustentando que a orientação ao cliente deve prevalecer sobre metas.", "faça o cliente assinar um termo de ciência genérico e mantenha a captação."], answer: 2, explanation: "Gabarito: O Código de Ética exige que os interesses do cliente e a qualidade da orientação (Dever Fiduciário) prevaleçam sobre pressões por metas comerciais agressivas." },
            { id: 35, diff: "Fácil", text: "Um parente do profissional CPA vai operar ações que o profissional também possui. O profissional não participou do atendimento. A conduta adequada é:", options: ["prosseguir operando e registrar depois.", "concluir a operação sem alardes se o compliance não perguntar.", "dar apenas dicas públicas e ignorar os controles internos.", "declarar o vínculo e informar aos controles internos as intenções de compra do seu parente."], answer: 3, explanation: "Gabarito: Trata-se de potencial conflito de interesse. A conduta correta e preventiva é abster-se da operação e reportar o vínculo ao compliance imediatamente." },
            { id: 36, diff: "Fácil", text: "Falha interna no sistema atrasou o resgate de um fundo. Esse evento caracteriza-se como:", options: ["falhas de sistemas, erros humanos ou problemas de processo que causem perdas financeiras (Risco Operacional).", "atrasos de sistemas de telecomunicação de terceiros.", "irregularidades em controles internos sem perdas financeiras.", "erros de registro contábil de auditores externos."], answer: 0, explanation: "Gabarito: Falhas humanas, paradas de sistemas de TI internos ou problemas procedimentais são classificados estritamente como Risco Operacional." },
            { id: 37, diff: "Difícil", text: "Investidor grande executa ordens agressivas no fim do pregão em ativos de baixa liquidez para inflar o fechamento de um índice. Essa prática caracteriza:", options: ["money pass (passagem de dinheiro dissimulada).", "manipulação de índice de referência, pela alteração deliberada de preços para influenciar o mercado.", "insider trading secundário.", "churning para girar patrimônio."], answer: 1, explanation: "Gabarito: A atuação forçada nos últimos minutos (leilão de fechamento) para distorcer intencionalmente cotações e índices configura manipulação de mercado/preços." },
            { id: 38, diff: "Fácil", text: "Corretora paga bônus por giro. Profissional nota robôs gerando milhares de compras/vendas diárias sem alterar preço, só para gerar corretagem. O CPA deve:", options: ["ajustar a comunicação comercial e seguir faturando.", "culpar os clientes pelo uso indevido de robôs.", "comunicar formalmente o compliance sobre o padrão de operações suspeitas (churning) e sugerir suspensão.", "aguardar auditoria externa independente pegar a falha no ano seguinte."], answer: 2, explanation: "Gabarito: Giro excessivo gerado intencionalmente para faturar comissões em detrimento do cliente é fraude conhecida como Churning e deve ser barrada pelo Compliance." },
            { id: 39, diff: "Médio", text: "Cliente teve crédito negado em banco tradicional. Fernanda explica que as finanças descentralizadas (DeFi) podem ser alternativa, pois oferecem:", options: ["garantia de subsídios do governo para empréstimos em criptomoedas.", "isenção de garantias ou colaterais nas operações cripto.", "crédito exclusivo a corporações e validadores de rede.", "acesso aberto a protocolos de crédito, permitindo empréstimos via contratos autoexecutáveis sem depender de grandes bancos."], answer: 3, explanation: "Gabarito: DeFi utiliza Smart Contracts em Blockchain para prover serviços financeiros P2P sem o crivo burocrático de um intermediário central (banco tradicional)." },
            { id: 40, diff: "Médio", text: "O cliente ficou surpreso que o empréstimo DeFi não dependia de cartórios ou gerentes. Rafael esclarece que isso é seguro porque o blockchain:", options: ["permite o registro imutável e compartilhado das regras, viabilizando a execução automática de contratos (smart contracts).", "substitui instituições financeiras e não possui regras regulatórias.", "atua como carteira centralizada operada pelo Banco Central do país.", "garante proteção contra volatilidade das criptomoedas."], answer: 0, explanation: "Gabarito: A segurança do Blockchain deriva de sua rede descentralizada e imutável, onde códigos de contrato inteligente executam a lógica automaticamente de forma pública e inalterável." },
            
            { id: 41, diff: "Médio", text: "Cliente teme roubos bilionários ocorridos em grandes corretoras de cripto centralizadas (CEX). Carla diz que numa plataforma DEX (Decentralized Exchange):", options: ["concentra os ativos em cofres off-line super secretas.", "funciona sem custódia centralizada de ativos, reduzindo impactos de ataques, pois as operações ocorrem da carteira do usuário (P2P).", "depende de aprovação da CVM para dar segurança cibernética às trocas.", "mantém controle central dos ativos, mas com seguro cobrindo 100% de hackers."], answer: 1, explanation: "Gabarito: Nas DEXs, não há um 'banco centralizador' dos fundos dos clientes. O investidor negocia direto da sua carteira (non-custodial), mitigando risco de hack ao tesouro da corretora." },
            { id: 42, diff: "Médio", text: "Um novo cliente (Pessoa Politicamente Exposta - PEP) deseja realizar um depósito de R$ 300.000,00 em espécie na agência bancária. Segundo as normas de PLD/FT, o profissional deve:", options: ["recusar o depósito, pois é vedado o recebimento de valores em espécie superiores a R$ 50.000,00 de clientes classificados como PEP.", "receber o recurso em sala privada e não comunicar ao COAF, já que a PEP tem foro privilegiado.", "acolher o depósito mediante identificação completa do portador, registrar a origem declarada e comunicar obrigatoriamente a operação em espécie ao COAF.", "orientar o cliente a fracionar o depósito em quantias de R$ 9.000,00 para evitar bloqueios regulatórios e não chamar atenção (smurfing)."], answer: 2, explanation: "Gabarito: Depósitos em espécie acima de R$ 50 mil possuem comunicação automática/obrigatória ao COAF. O banco não deve recusar sem motivo suspeito, mas deve registrar e reportar." },
            { id: 43, diff: "Difícil", text: "Sobre a Resolução CVM 175 que trata de Fundos de Investimento, as subclasses de cotas dentro de uma mesma classe devem, obrigatoriamente, diferenciar-se entre si apenas em relação a:", options: ["política de investimento, indexadores de benchmark e concentração por emissor.", "regime tributário e moeda de liquidação das cotas no exterior.", "segregação patrimonial dos ativos e custodiantes terceirizados vinculados.", "taxas de administração, taxas de ingresso/saída, público-alvo e prazos de carência."], answer: 3, explanation: "Gabarito: Na CVM 175, as CLASSES de um mesmo fundo podem ter diferentes políticas de investimento e patrimônios segregados. As SUBCLASSES (dentro da mesma classe) compartilham os ativos, mas diferenciam-se em custos (taxas), público-alvo e condições de resgate/carência." },
            { id: 44, diff: "Difícil", text: "Um fundo de investimento foi notificado pela Anbima por divulgar em seu prospecto que era 'Totalmente sustentável', mas mantinha em carteira debêntures de empresas ligadas a desmatamento ilegal sem plano de mitigação. Essa prática de comunicação enganosa é conhecida como:", options: ["Greenwashing (lavagem verde).", "Front Running.", "Suitability Inverso.", "Blue-washing ambiental."], answer: 0, explanation: "Gabarito: Greenwashing ocorre quando instituições tentam passar uma imagem falsa de responsabilidade socioambiental (ESG) para atrair investidores, enquanto suas práticas reais não sustentam tal discurso." },
            { id: 45, diff: "Difícil", text: "Sempre que ocorre um acidente de avião noticiado nos telejornais, aumentam as vendas de seguros de viagem e de vida, embora o risco real de acidentes aéreos continue o mesmo (e seja menor que o de carro). Na economia comportamental, esse viés é explicado pela:", options: ["Heurística da Representatividade.", "Heurística da Disponibilidade.", "Ancoragem.", "Excesso de Confiança."], answer: 1, explanation: "Gabarito: A Heurística da Disponibilidade faz com que indivíduos julguem a probabilidade de um evento com base na facilidade com que exemplos recentes ou impactantes vêm à mente." },
            { id: 46, diff: "Difícil", text: "Um cliente comprou ações da Empresa X a R$ 20,00. Hoje, as ações valem R$ 8,00, a empresa perdeu seus fundamentos e a recomendação técnica é de venda. No entanto, o cliente se recusa a vender, afirmando que só vende quando voltar a R$ 20,00 'para não sair no prejuízo'. Esse viés comportamental é a:", options: ["Contabilidade Mental.", "Efeito Manada.", "Aversão à Perda.", "Heurística da Representatividade."], answer: 2, explanation: "Gabarito: A Aversão à Perda (Loss Aversion) explica a relutância do investidor em realizar (assumir) o prejuízo, preferindo arriscar manter um ativo ruim apenas para evitar a dor psicológica de concretizar a perda." },
            { id: 47, diff: "Difícil", text: "Um investidor mantém aplicações em um Fundo de Ações e em um Fundo Multimercado Longo Prazo, ambos constituídos na forma de condomínio aberto. Com relação à tributação do 'come-cotas' (antecipação de IR nos meses de maio e novembro), o investidor deve saber que ela:", options: ["incidirá em ambos os fundos, sendo 15% no fundo de ações e 20% no multimercado.", "incidirá apenas no Fundo de Ações, visto que fundos multimercados são isentos até o momento do resgate.", "foi extinta para fundos abertos pela legislação recente, ocorrendo tributação apenas no momento do resgate total.", "incidirá somente sobre o Fundo Multimercado Longo Prazo, à alíquota de 15%. Fundos de Ações são isentos de come-cotas."], answer: 3, explanation: "Gabarito: Fundos de Ações (composição mínima exigida em renda variável) NÃO possuem a antecipação semestral de IR (come-cotas). O come-cotas incide em Fundos de Curto e Longo Prazo (Renda Fixa, Cambial e Multimercado)." },
            { id: 48, diff: "Difícil", text: "O gestor de um fundo de renda fixa informa em seu relatório que o fundo possui um VaR (Value at Risk) diário de R$ 50.000,00 com 95% de nível de confiança. Isso significa que, em condições normais de mercado:", options: ["há uma probabilidade de apenas 5% de o fundo perder MAIS de R$ 50.000,00 em um único dia.", "o fundo garante um rendimento diário mínimo de R$ 50.000,00 em 95% dos dias do ano.", "há 95% de chance de o fundo sofrer prejuízos superiores a R$ 50.000,00 todos os dias.", "o limite máximo de perda do fundo, em qualquer cenário de estresse econômico, está travado em exatos R$ 50.000,00."], answer: 0, explanation: "Gabarito: O VaR mensura a perda máxima esperada em condições normais. Com 95% de confiança, significa que em 95% das vezes a perda será MENOR ou igual a 50 mil. Logo, sobra 5% de probabilidade de a perda superar os 50 mil reais." },
            { id: 49, diff: "Difícil", text: "Julio possui um VGBL no qual declarou o regime de tributação regressiva (definitivo) no ato da contratação. Hoje, passados 5 anos, ele deseja fazer a portabilidade de todos os recursos para um PGBL com tabela progressiva na mesma seguradora. Pela legislação brasileira de Previdência Complementar, essa operação:", options: ["é permitida, mas ensejará o pagamento imediato de imposto de renda sobre os rendimentos auferidos.", "não é permitida, pois é vedada a portabilidade entre planos de naturezas diferentes (de VGBL para PGBL) e a troca do regime regressivo para o progressivo.", "é permitida livremente sem tributação, desde que mantida a instituição administradora.", "é permitida apenas se o saldo acumulado for transferido para a cobertura de risco de morte."], answer: 1, explanation: "Gabarito: A legislação proíbe portabilidade de VGBL para PGBL (e vice-versa). Além disso, não é possível migrar do Regime Regressivo para o Progressivo (a lei nova até permitiu a escolha do regime no resgate/benefício, mas a mudança de natureza do plano segue vedada)." },
            { id: 50, diff: "Difícil", text: "Segundo os Códigos Anbima, os fundos de investimento devem obrigatoriamente registrar os ativos de sua carteira pelo valor que eles poderiam ser negociados no mercado no dia do fechamento da cota. Esse processo evita transferência de riqueza entre cotistas que aplicam ou resgatam no mesmo dia, e é chamado de:", options: ["Duration Modificada.", "Marcação na Curva de Juros (Valor de Aquisição).", "Marcação a Mercado (MaM).", "Hedge Contábil."], answer: 2, explanation: "Gabarito: Marcação a Mercado é a atualização diária do preço dos ativos de um fundo com base no valor justo pelo qual seriam negociados naquele dia. Isso garante equidade no cálculo do valor da cota para quem entra e quem sai do fundo." }
        ];

        const App = () => {
            const [status, setStatus] = useState('start'); // start, playing, paused, review
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [answers, setAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(150 * 60); // 2h 30m = 9000 seconds
            const [score, setScore] = useState(0);

            // Carregar estado salvo do LocalStorage
            useEffect(() => {
                const savedState = localStorage.getItem('cpa_simulado_state');
                if (savedState) {
                    try {
                        const parsed = JSON.parse(savedState);
                        if (parsed.status === 'playing' || parsed.status === 'paused') {
                            setAnswers(parsed.answers || {});
                            setTimeLeft(parsed.timeLeft || 9000);
                            setStatus('paused'); 
                            setCurrentQuestion(parsed.currentQuestion || 0);
                        }
                    } catch (e) {
                        console.error("Erro ao ler localStorage", e);
                    }
                }
            }, []);

            // Salvar estado no LocalStorage
            useEffect(() => {
                if (status === 'playing' || status === 'paused') {
                    localStorage.setItem('cpa_simulado_state', JSON.stringify({
                        status: status,
                        answers: answers,
                        timeLeft: timeLeft,
                        currentQuestion: currentQuestion
                    }));
                }
                if (status === 'review') {
                    localStorage.removeItem('cpa_simulado_state'); // Limpa ao finalizar
                }
            }, [answers, timeLeft, status, currentQuestion]);

            useEffect(() => {
                let interval = null;
                if (status === 'playing' && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(interval);
                                setStatus('review');
                                calculateScore(answers);
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                } else {
                    clearInterval(interval);
                }
                return () => clearInterval(interval);
            }, [status, timeLeft]);

            const handleAnswer = (qIndex, optionIndex) => {
                setAnswers(prev => ({
                    ...prev,
                    [qIndex]: optionIndex
                }));
            };

            const calculateScore = (finalAnswers = answers) => {
                let correctCount = 0;
                questionsDB.forEach((q, index) => {
                    if (finalAnswers[index] === q.answer) {
                        correctCount++;
                    }
                });
                setScore(correctCount);
            };

            const handleFinish = () => {
                const isConfirmed = window.confirm("Tem certeza que deseja finalizar e entregar o simulado agora?");
                if(isConfirmed) {
                    calculateScore();
                    setStatus('review');
                }
            };

            const handleStart = () => setStatus('playing');
            const handlePause = () => setStatus('paused');
            const handleResume = () => setStatus('playing');
            const handleRestart = () => {
                if(window.confirm("Isso apagará o simulado atual e criará um novo. Deseja continuar?")) {
                    localStorage.removeItem('cpa_simulado_state');
                    setAnswers({});
                    setTimeLeft(9000);
                    setCurrentQuestion(0);
                    setStatus('start');
                }
            };

            const formatTime = (seconds) => {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const stats = useMemo(() => {
                const answeredCount = Object.keys(answers).length;
                return { answeredCount, total: questionsDB.length };
            }, [answers]);

            if (status === 'start') {
                return (
                    <div className="flex flex-col items-center justify-center h-full bg-slate-900 text-slate-100 p-6">
                        <div className="max-w-2xl text-center space-y-6">
                            <h1 className="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-green-400 to-emerald-600">Simulado Oficial ANBIMA</h1>
                            <h2 className="text-2xl font-semibold text-slate-300">Nova CPA (Base)</h2>
                            <p className="text-slate-400 text-lg leading-relaxed">
                                Este simulado contém as <strong>50 questões calibradas</strong> da nova estrutura. 
                                <br/><br/>
                                <span className="text-amber-300 bg-amber-900/40 px-3 py-1 rounded">Novidade:</span> Modo de <strong>Estudo Ativo</strong> habilitado! Ao clicar na resposta, você verá imediatamente se acertou ou errou, junto com a explicação oficial do gabarito.
                            </p>
                            <div className="grid grid-cols-3 gap-4 bg-slate-800 p-6 rounded-xl text-center mt-6 shadow-lg shadow-black/50">
                                <div><div className="text-3xl font-bold text-white">50</div><div className="text-sm text-slate-400">Questões</div></div>
                                <div><div className="text-3xl font-bold text-white">2h 30m</div><div className="text-sm text-slate-400">Tempo Limite</div></div>
                                <div><div className="text-3xl font-bold text-white">70%</div><div className="text-sm text-slate-400">Média (35 acertos)</div></div>
                            </div>
                            <div className="pt-8">
                                <button onClick={handleStart} className="px-8 py-4 bg-green-600 hover:bg-green-500 transition-colors text-white text-xl font-bold rounded-full shadow-lg shadow-green-900/50 transform hover:scale-105 active:scale-95 w-full md:w-auto">
                                    Iniciar Estudo Ativo
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (status === 'paused') {
                return (
                    <div className="flex flex-col items-center justify-center h-full bg-slate-900 text-slate-100 p-6">
                        <div className="text-center space-y-6">
                            <h2 className="text-4xl font-bold text-white">Simulado Pausado</h2>
                            <p className="text-xl text-slate-400">Tempo restante: <span className="font-mono text-green-400 font-bold">{formatTime(timeLeft)}</span></p>
                            <p className="text-slate-500">Seu progresso foi salvo. Você pode fechar a janela e voltar depois.</p>
                            <div className="flex flex-col md:flex-row gap-4 justify-center pt-8">
                                <button onClick={handleResume} className="px-8 py-3 bg-green-600 hover:bg-green-500 text-white font-bold rounded-lg shadow-lg">Continuar</button>
                                <button onClick={handleRestart} className="px-8 py-3 bg-slate-700 hover:bg-red-600 text-white font-bold rounded-lg transition-colors">Reiniciar Simulado</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (status === 'review') {
                const isApproved = score >= 35;
                const percent = Math.round((score / questionsDB.length) * 100);
                
                return (
                    <div className="h-full overflow-y-auto custom-scrollbar bg-slate-50 p-4 md:p-8">
                        <div className="max-w-4xl mx-auto space-y-8">
                            <div className={`p-8 rounded-2xl shadow-lg text-center ${isApproved ? 'bg-gradient-to-br from-green-500 to-emerald-700 text-white' : 'bg-gradient-to-br from-red-500 to-rose-700 text-white'}`}>
                                <h1 className="text-4xl font-bold mb-2">{isApproved ? 'Parabéns! Você foi Aprovado(a) 🥳' : 'Não foi dessa vez. Continue estudando! 📚'}</h1>
                                <p className="text-xl opacity-90">Sua pontuação final:</p>
                                <div className="text-6xl font-black mt-4">{score} <span className="text-3xl font-medium">/ 50</span></div>
                                <div className="text-xl mt-2 font-semibold">({percent}%) - Mínimo exigido: 70%</div>
                                <button onClick={handleRestart} className="mt-8 px-6 py-2 bg-white/20 hover:bg-white/30 backdrop-blur font-bold rounded-lg transition-colors">Refazer Simulado</button>
                            </div>
                            
                            <div className="text-center text-slate-500 mt-8">
                                O gabarito e as explicações detalhadas já foram conferidos ao longo das questões no modo Estudo Ativo. Refaça o simulado para praticar novamente!
                            </div>
                        </div>
                    </div>
                );
            }

            const q = questionsDB[currentQuestion];
            const hasAnsweredCurrent = answers[currentQuestion] !== undefined;

            return (
                <div className="flex flex-col h-full overflow-hidden bg-slate-50">
                    {/* Header bar */}
                    <header className="glass-panel flex items-center justify-between p-4 z-10 sticky top-0 shrink-0">
                        <div className="flex items-center gap-4">
                            <button onClick={handlePause} className="p-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg shadow-sm border border-slate-200" title="Pausar simulado">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                            </button>
                            <div className="hidden md:block font-bold text-slate-700">Modo Estudo Ativo</div>
                        </div>
                        
                        <div className={`text-xl font-mono font-bold flex items-center gap-2 ${timeLeft < 300 ? 'text-red-600 animate-pulse' : 'text-slate-800'}`}>
                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clipRule="evenodd" /></svg>
                            {formatTime(timeLeft)}
                        </div>

                        <button onClick={handleFinish} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white text-sm font-bold rounded-lg shadow-md transition-colors">
                            Entregar
                        </button>
                    </header>

                    <div className="flex flex-1 overflow-hidden">
                        {/* Sidebar */}
                        <aside className="w-20 md:w-64 bg-white border-r border-slate-200 overflow-y-auto custom-scrollbar shrink-0 p-2 md:p-4 hidden sm:block">
                            <div className="text-xs font-bold text-slate-400 mb-4 uppercase tracking-wider text-center md:text-left">Progresso</div>
                            <div className="mb-4 text-center md:text-left">
                                <span className="font-bold text-lg md:text-2xl text-slate-700">{stats.answeredCount}</span>
                                <span className="text-slate-500"> / {stats.total}</span>
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-5 gap-1 md:gap-2">
                                {questionsDB.map((_, i) => {
                                    const isCurrent = i === currentQuestion;
                                    const isAnswered = answers[i] !== undefined;
                                    let btnClass = "h-8 md:h-10 w-full rounded flex items-center justify-center text-xs md:text-sm font-medium border cursor-pointer transition-all";
                                    
                                    if (isCurrent) {
                                        btnClass += " ring-2 ring-blue-500 ring-offset-1 border-transparent " + (isAnswered ? "bg-blue-600 text-white" : "bg-white text-blue-600");
                                    } else if (isAnswered) {
                                        btnClass += " bg-slate-200 border-transparent text-slate-600";
                                    } else {
                                        btnClass += " bg-white border-slate-200 text-slate-400 hover:bg-slate-50";
                                    }

                                    return (
                                        <button key={i} onClick={() => setCurrentQuestion(i)} className={btnClass} title={`Ir para questão ${i+1}`}>{i + 1}</button>
                                    )
                                })}
                            </div>
                        </aside>

                        {/* Main Question Area - Com Feedback Imediato */}
                        <main className="flex-1 overflow-y-auto custom-scrollbar bg-slate-50 relative pb-24">
                            <div className="max-w-3xl mx-auto p-4 md:p-8">
                                <div className="mb-8">
                                    <div className="flex items-center gap-3 mb-4">
                                        <span className="bg-slate-800 text-white px-3 py-1 rounded font-bold text-sm">Questão {currentQuestion + 1}</span>
                                        <span className="bg-slate-200 text-slate-600 px-3 py-1 rounded text-sm">{q.diff}</span>
                                    </div>
                                    <h2 className="text-lg md:text-xl text-slate-800 leading-relaxed font-medium whitespace-pre-wrap">
                                        {q.text}
                                    </h2>
                                </div>

                                <div className="space-y-3">
                                    {q.options.map((option, idx) => {
                                        const isSelected = answers[currentQuestion] === idx;
                                        const isCorrect = idx === q.answer;
                                        
                                        // Estilização dinâmica condicional
                                        let optionClass = 'border-slate-200 bg-white hover:border-blue-300 hover:bg-slate-50 cursor-pointer';
                                        let dotClass = 'border-slate-300';
                                        let textClass = 'text-slate-600';
                                        let letterClass = 'text-slate-400';

                                        if (hasAnsweredCurrent) {
                                            if (isCorrect) {
                                                optionClass = 'border-green-500 bg-green-50/70 shadow-sm cursor-default';
                                                dotClass = 'border-green-500 bg-green-500';
                                                textClass = 'text-green-900 font-medium';
                                                letterClass = 'text-green-700';
                                            } else if (isSelected) {
                                                optionClass = 'border-red-400 bg-red-50/70 shadow-sm cursor-default';
                                                dotClass = 'border-red-500 bg-red-500';
                                                textClass = 'text-red-900 font-medium line-through opacity-70';
                                                letterClass = 'text-red-700';
                                            } else {
                                                optionClass = 'border-slate-200 bg-white opacity-50 cursor-default';
                                                dotClass = 'border-slate-300';
                                                textClass = 'text-slate-400';
                                            }
                                        }

                                        return (
                                            <label key={idx} className={`flex items-start gap-4 p-4 rounded-xl border-2 transition-all ${optionClass}`}>
                                                <div className="pt-1">
                                                    <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors ${dotClass}`}>
                                                        {hasAnsweredCurrent && (isCorrect || isSelected) && <div className="w-2.5 h-2.5 bg-white rounded-full"></div>}
                                                    </div>
                                                </div>
                                                <div className={`flex-1 text-base md:text-lg ${textClass}`}>
                                                    <span className={`font-bold mr-2 ${letterClass}`}>{String.fromCharCode(65 + idx)})</span> 
                                                    {option}
                                                </div>
                                                {/* Input desabilitado se a questão já foi respondida para não alterar o acerto/erro */}
                                                <input type="radio" name={`question-${currentQuestion}`} value={idx} checked={isSelected} onChange={() => !hasAnsweredCurrent && handleAnswer(currentQuestion, idx)} disabled={hasAnsweredCurrent} className="hidden" />
                                            </label>
                                        )
                                    })}
                                </div>

                                {/* Seção de Explicação que surge assim que a resposta é clicada */}
                                {hasAnsweredCurrent && (
                                    <div className={`mt-8 p-6 rounded-xl border-l-4 shadow-sm transition-all animate-fade-in-up ${answers[currentQuestion] === q.answer ? 'bg-green-50 border-green-500' : 'bg-red-50 border-red-500'}`}>
                                        <h3 className={`font-bold text-xl mb-3 flex items-center gap-2 ${answers[currentQuestion] === q.answer ? 'text-green-800' : 'text-red-800'}`}>
                                            {answers[currentQuestion] === q.answer ? (
                                                <><svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg> Correto!</>
                                            ) : (
                                                <><svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg> Incorreto</>
                                            )}
                                        </h3>
                                        <p className="text-slate-800 leading-relaxed text-lg">
                                            {q.explanation}
                                        </p>
                                    </div>
                                )}
                            </div>
                        </main>
                    </div>

                    {/* Footer Nav Bar */}
                    <footer className="glass-panel absolute bottom-0 left-0 right-0 sm:left-20 md:left-64 p-4 border-t border-slate-200 flex justify-between items-center shrink-0">
                        <button 
                            onClick={() => setCurrentQuestion(prev => Math.max(0, prev - 1))}
                            disabled={currentQuestion === 0}
                            className={`px-6 py-2.5 rounded-lg font-bold flex items-center gap-2 ${currentQuestion === 0 ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 shadow-sm'}`}>
                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clipRule="evenodd" /></svg>
                            Anterior
                        </button>

                        <div className="text-sm font-bold text-slate-500 block sm:hidden">{currentQuestion + 1} / {questionsDB.length}</div>

                        {currentQuestion < questionsDB.length - 1 ? (
                            <button 
                                onClick={() => setCurrentQuestion(prev => Math.min(questionsDB.length - 1, prev + 1))}
                                className="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold shadow-md flex items-center gap-2 transition-colors">
                                Próxima
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clipRule="evenodd" /></svg>
                            </button>
                        ) : (
                            <button 
                                onClick={handleFinish}
                                className="px-6 py-2.5 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold shadow-md flex items-center gap-2 transition-colors">
                                Finalizar
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" /></svg>
                            </button>
                        )}
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
    </style>
</body>
</html>
